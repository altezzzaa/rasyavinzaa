<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hand Tracking</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mediapipe/0.10.3/tasks-vision/tasks-vision.umd.js" crossorigin="anonymous"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --panel: #111118;
      --accent: #00ffe0;
      --accent2: #ff3cac;
      --accent3: #ffe600;
      --text: #e8e8f0;
      --dim: #44445a;
      --glow: 0 0 18px #00ffe088;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      padding: 1.5rem 2rem 1rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      border-bottom: 1px solid #1e1e2e;
    }

    .logo-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: var(--glow);
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.08em;
      color: var(--accent);
      text-shadow: var(--glow);
    }

    h1 span { color: var(--text); }

    .badge {
      margin-left: auto;
      font-size: 0.65rem;
      padding: 0.25rem 0.7rem;
      border: 1px solid var(--accent2);
      color: var(--accent2);
      border-radius: 99px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .main {
      display: flex;
      gap: 1.5rem;
      padding: 2rem;
      width: 100%;
      max-width: 1200px;
      align-items: flex-start;
    }

    .canvas-wrap {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1.5px solid #1e1e30;
      flex: 1;
      background: #000;
      box-shadow: 0 0 40px #00ffe01a;
    }

    #video {
      display: block;
      width: 100%;
      max-width: 720px;
      border-radius: 16px;
      transform: scaleX(-1);
    }

    #canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform: scaleX(-1);
    }

    .overlay-label {
      position: absolute;
      top: 14px; left: 14px;
      font-size: 0.65rem;
      color: var(--accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      background: #0a0a0fcc;
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      border: 1px solid #00ffe033;
    }

    .side {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      min-width: 230px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid #1e1e30;
      border-radius: 14px;
      padding: 1.2rem 1.3rem;
    }

    .panel-title {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 1rem;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0;
      border-bottom: 1px solid #1a1a28;
      font-size: 0.78rem;
    }

    .stat-row:last-child { border-bottom: none; }
    .stat-label { color: var(--dim); }
    .stat-val { color: var(--accent); font-weight: 700; }

    #finger-display {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .finger-chip {
      background: #0f0f1a;
      border: 1px solid var(--dim);
      border-radius: 8px;
      padding: 0.5rem 0.7rem;
      font-size: 0.72rem;
      color: var(--dim);
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .finger-chip.up {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 10px #00ffe033;
    }

    .finger-chip .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--dim);
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .finger-chip.up .dot { background: var(--accent); }

    #gesture-display {
      font-family: 'Syne', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--accent3);
      text-align: center;
      padding: 0.5rem 0;
      letter-spacing: 0.04em;
      min-height: 2.2rem;
      text-shadow: 0 0 16px #ffe60066;
      transition: color 0.2s;
    }

    #start-btn {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, var(--accent) 0%, #00b8a0 100%);
      color: #0a0a0f;
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: opacity 0.2s, transform 0.15s;
    }

    #start-btn:hover { opacity: 0.85; transform: translateY(-1px); }
    #start-btn:active { transform: translateY(0); }
    #start-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #status {
      font-size: 0.7rem;
      text-align: center;
      color: var(--dim);
      padding: 0.3rem 0;
    }

    /* Landmark colors */
    .lm-wrist { --lm-c: #ff3cac; }
    .lm-thumb { --lm-c: #ffe600; }
    .lm-index { --lm-c: #00ffe0; }
    .lm-middle { --lm-c: #a78bfa; }
    .lm-ring { --lm-c: #fb923c; }
    .lm-pinky { --lm-c: #4ade80; }

    @media (max-width: 800px) {
      .main { flex-direction: column; padding: 1rem; }
      .side { min-width: unset; width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-dot"></div>
  <h1>HAND<span>TRACK</span></h1>
  <div class="badge">MediaPipe · Real-Time</div>
</header>

<div class="main">
  <div class="canvas-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="overlay-label" id="cam-label">◉ KAMERA MATI</div>
  </div>

  <div class="side">
    <div class="panel">
      <div class="panel-title">Status</div>
      <div class="stat-row">
        <span class="stat-label">Tangan terdeteksi</span>
        <span class="stat-val" id="hand-count">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Jari terangkat</span>
        <span class="stat-val" id="finger-count">—</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">FPS</span>
        <span class="stat-val" id="fps-val">—</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Jari</div>
      <div id="finger-display">
        <div class="finger-chip" id="chip-thumb"><div class="dot"></div>Jempol</div>
        <div class="finger-chip" id="chip-index"><div class="dot"></div>Telunjuk</div>
        <div class="finger-chip" id="chip-middle"><div class="dot"></div>Tengah</div>
        <div class="finger-chip" id="chip-ring"><div class="dot"></div>Manis</div>
        <div class="finger-chip" id="chip-pinky"><div class="dot"></div>Kelingking</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Gestur Terdeteksi</div>
      <div id="gesture-display">—</div>
    </div>

    <button id="start-btn">▶ Aktifkan Kamera</button>
    <div id="status">Klik tombol untuk mulai</div>
  </div>
</div>

<script type="module">
  // ── MediaPipe via CDN UMD ──────────────────────────────────────────────────
  const { HandLandmarker, FilesetResolver } = window.mediapipeTasks_vision ?? window;

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const btn = document.getElementById('start-btn');
  const status = document.getElementById('status');
  const camLabel = document.getElementById('cam-label');
  const handCount = document.getElementById('hand-count');
  const fingerCount = document.getElementById('finger-count');
  const fpsVal = document.getElementById('fps-val');
  const gestureDisplay = document.getElementById('gesture-display');

  const chips = {
    thumb:  document.getElementById('chip-thumb'),
    index:  document.getElementById('chip-index'),
    middle: document.getElementById('chip-middle'),
    ring:   document.getElementById('chip-ring'),
    pinky:  document.getElementById('chip-pinky'),
  };

  let handLandmarker = null;
  let running = false;
  let lastTime = 0;
  let frameCount = 0;
  let fpsTimer = performance.now();

  // Warna per grup titik
  const GROUP_COLORS = {
    wrist:  '#ff3cac',
    thumb:  '#ffe600',
    index:  '#00ffe0',
    middle: '#a78bfa',
    ring:   '#fb923c',
    pinky:  '#4ade80',
  };

  function landmarkGroup(i) {
    if (i === 0) return 'wrist';
    if (i >= 1 && i <= 4) return 'thumb';
    if (i >= 5 && i <= 8) return 'index';
    if (i >= 9 && i <= 12) return 'middle';
    if (i >= 13 && i <= 16) return 'ring';
    return 'pinky';
  }

  // Koneksi antar landmark (MediaPipe HAND_CONNECTIONS)
  const CONNECTIONS = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [0,9],[9,10],[10,11],[11,12],
    [0,13],[13,14],[14,15],[15,16],
    [0,17],[17,18],[18,19],[19,20],
    [5,9],[9,13],[13,17],
  ];

  async function initModel() {
    status.textContent = 'Memuat model AI…';
    btn.disabled = true;
    try {
      const vision = await FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm'
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
          delegate: 'GPU',
        },
        runningMode: 'VIDEO',
        numHands: 2,
      });
      status.textContent = 'Model siap! Kamera aktif…';
    } catch (e) {
      status.textContent = 'Gagal memuat model: ' + e.message;
      btn.disabled = false;
      throw e;
    }
  }

  async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 720, height: 480, facingMode: 'user' } });
    video.srcObject = stream;
    await new Promise(r => video.addEventListener('loadeddata', r, { once: true }));
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    camLabel.textContent = '◉ LIVE';
    camLabel.style.color = 'var(--accent)';
    running = true;
    requestAnimationFrame(detect);
  }

  function isFingerUp(lm, tip, pip) {
    return lm[tip].y < lm[pip].y;
  }

  function isThumbUp(lm) {
    // Thumb: tip x vs ip x (mirrored)
    return Math.abs(lm[4].x - lm[3].x) > 0.04;
  }

  function detectGesture(fingers) {
    const [thumb, index, middle, ring, pinky] = fingers;
    const count = fingers.filter(Boolean).length;
    if (!thumb && !index && !middle && !ring && !pinky) return '✊ Kepalan';
    if (thumb && index && middle && ring && pinky) return '🖐 Buka Semua';
    if (!thumb && index && !middle && !ring && !pinky) return '☝️ Satu';
    if (!thumb && index && middle && !ring && !pinky) return '✌️ Peace';
    if (!thumb && index && middle && ring && !pinky) return '🤟 Tiga';
    if (!thumb && index && middle && ring && pinky) return '🖖 Empat';
    if (thumb && !index && !middle && !ring && pinky) return '🤙 Shaka';
    if (thumb && index && !middle && !ring && !pinky) return '👌 L-Shape';
    if (!thumb && !index && !middle && !ring && pinky) return '🤙 Kelingking';
    if (thumb && !index && !middle && !ring && !pinky) return '👍 Jempol';
    return `${count} Jari`;
  }

  function detect(now) {
    if (!running) return;
    if (video.readyState < 2) { requestAnimationFrame(detect); return; }

    frameCount++;
    if (now - fpsTimer >= 1000) {
      fpsVal.textContent = frameCount;
      frameCount = 0;
      fpsTimer = now;
    }

    const result = handLandmarker.detectForVideo(video, now);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const hands = result.landmarks ?? [];
    handCount.textContent = hands.length;

    if (hands.length === 0) {
      fingerCount.textContent = '—';
      gestureDisplay.textContent = '—';
      Object.values(chips).forEach(c => c.classList.remove('up'));
    }

    hands.forEach((lm) => {
      // Draw connections
      CONNECTIONS.forEach(([a, b]) => {
        const pa = lm[a], pb = lm[b];
        const groupA = landmarkGroup(a);
        const grad = ctx.createLinearGradient(
          pa.x * canvas.width, pa.y * canvas.height,
          pb.x * canvas.width, pb.y * canvas.height
        );
        grad.addColorStop(0, GROUP_COLORS[groupA] + 'cc');
        grad.addColorStop(1, GROUP_COLORS[landmarkGroup(b)] + 'cc');
        ctx.beginPath();
        ctx.moveTo(pa.x * canvas.width, pa.y * canvas.height);
        ctx.lineTo(pb.x * canvas.width, pb.y * canvas.height);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2.5;
        ctx.shadowColor = GROUP_COLORS[groupA];
        ctx.shadowBlur = 8;
        ctx.stroke();
        ctx.shadowBlur = 0;
      });

      // Draw landmarks
      lm.forEach((p, i) => {
        const group = landmarkGroup(i);
        const color = GROUP_COLORS[group];
        const x = p.x * canvas.width;
        const y = p.y * canvas.height;
        const r = [0, 5, 9, 13, 17].includes(i) ? 7 : 5;

        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 14;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Ring for major joints
        if ([0, 5, 9, 13, 17].includes(i)) {
          ctx.beginPath();
          ctx.arc(x, y, r + 4, 0, Math.PI * 2);
          ctx.strokeStyle = color + '55';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
      });

      // Finger detection
      const thumb  = isThumbUp(lm);
      const index  = isFingerUp(lm, 8, 6);
      const middle = isFingerUp(lm, 12, 10);
      const ring   = isFingerUp(lm, 16, 14);
      const pinky  = isFingerUp(lm, 20, 18);
      const fingers = [thumb, index, middle, ring, pinky];

      const upCount = fingers.filter(Boolean).length;
      fingerCount.textContent = upCount;

      chips.thumb.classList.toggle('up', thumb);
      chips.index.classList.toggle('up', index);
      chips.middle.classList.toggle('up', middle);
      chips.ring.classList.toggle('up', ring);
      chips.pinky.classList.toggle('up', pinky);

      gestureDisplay.textContent = detectGesture(fingers);
    });

    requestAnimationFrame(detect);
  }

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    btn.textContent = '⏳ Memuat…';
    try {
      await initModel();
      await startCamera();
      btn.textContent = '✓ Berjalan';
      status.textContent = 'Deteksi tangan aktif secara real-time';
    } catch (e) {
      btn.textContent = '▶ Coba Lagi';
      btn.disabled = false;
      status.textContent = 'Error: ' + e.message;
    }
  });
</script>
</body>
</html>
